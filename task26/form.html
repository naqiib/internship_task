<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's Your Coder Type? 🚀</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      padding: 20px;
    }
    .card {
      background: #fff;
      max-width: 440px;
      width: 100%;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: -60px; right: -60px;
      width: 140px; height: 140px;
      background: radial-gradient(circle, #f093fb55, transparent 70%);
      border-radius: 50%;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 4px;
      color: #2d2540;
    }
    .subtitle { color: #7c7391; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-weight: 700; font-size: 13px; color: #4b3f6b; margin-top: 18px; }
    input[type="text"], input[type="number"] {
      width: 100%; margin-top: 6px; padding: 12px 14px;
      border: 2px solid #e4e0f2; border-radius: 12px; font-size: 15px;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #764ba2; }
    .hobby-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px;
    }
    .hobby-option {
      display: flex; align-items: center; gap: 8px;
      background: #f6f4fb; border: 2px solid transparent; border-radius: 12px;
      padding: 10px 12px; cursor: pointer; font-size: 14px; font-weight: 600; color: #4b3f6b;
      transition: all 0.15s;
    }
    .hobby-option:has(input:checked) {
      border-color: #764ba2; background: #efe9fb;
    }
    .hobby-option input { accent-color: #764ba2; }
    button {
      width: 100%; margin-top: 26px; padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 20px rgba(118,75,162,0.35);
      transition: transform 0.15s;
    }
    button:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <h1>What's Your Coder Type? 🚀</h1>
    <p class="subtitle">Fill this out and PHP will crunch the numbers.</p>

    <form action="process.php" method="post">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="e.g. Naqib" required>

      <label for="age">Your Age</label>
      <input type="number" id="age" name="age" min="1" placeholder="e.g. 21" required>

      <label>Pick Your Hobbies</label>
      <div class="hobby-grid">
        <label class="hobby-option"><input type="checkbox" name="hobbies[]" value="Coding 💻"> 💻 Coding</label>
        <label class="hobby-option"><input type="checkbox" name="hobbies[]" value="Reading 📚"> 📚 Reading</label>
        <label class="hobby-option"><input type="checkbox" name="hobbies[]" value="Gaming 🎮"> 🎮 Gaming</label>
        <label class="hobby-option"><input type="checkbox" name="hobbies[]" value="Sports ⚽"> ⚽ Sports</label>
      </div>

      <button type="submit">Reveal My Result ✨</button>
    </form>
  </div>
</body>
</html>
